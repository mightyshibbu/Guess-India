name: party_charades
description: A fun party charades game where players guess words on the screen.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  vibration: ^3.1.3
  cupertino_icons: ^1.0.2
  sensors_plus: 6.1.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  vector_math: ^2.1.4
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/words.json
